repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint)
        entry: uv run --frozen ruff check
        language: system
        pass_filenames: false
        types: [python]
        files: ^(src|tests)/

      - id: ruff-format
        name: ruff format --check
        entry: uv run --frozen ruff format --check
        language: system
        pass_filenames: false
        types: [python]
        files: ^(src|tests)/

      # TODO: fix pending warnings
      # - id: basedpyright
      #   entry: uv run --frozen basedpyright
      #   language: system
      #   pass_filenames: false
      #   types: [python]

      - id: pytest
        name: pytest (test suite)
        entry: uv run --frozen pytest -q
        language: system
        pass_filenames: false
        types: [python]
